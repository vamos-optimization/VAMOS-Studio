[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vamos-studio"
version = "0.1.0.dev0"
description = "Streamlit GUI and analysis tool for VAMOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vamos_studio/resources/LICENSE-jMetal.txt"]
requires-python = ">=3.11"
dependencies = [
    # The backend. Pinned to a minor series: the studio reads parts of VAMOS's catalogue that
    # are internal in 1.2 (see CLAUDE.md, "Relationship to VAMOS").
    "vamos-optimization>=1.5.0,<1.6",
    "streamlit>=1.40",
    "pyyaml",
    "pandas",
    "plotly",
    # The hypervolume of the fronts.
    "moocore",
]

[project.optional-dependencies]
# Numba kernels for faster runs (VAMOS's `compute` extra).
fast = [
    "vamos-optimization[compute]>=1.5.0,<1.6",
]
dev = [
    "pytest",
    "ruff",
    # The tests execute the tutorials' notebooks.
    "nbformat",
    "nbclient",
    "ipykernel",
]

[tool.setuptools.packages.find]
include = ["vamos_studio*"]

[tool.setuptools.package-data]
"vamos_studio.backend.upstream.spaces" = ["*.yaml"]
"vamos_studio.notebooks" = ["*.ipynb"]
"vamos_studio" = ["resources/*.txt", "resources/*.md", "resources/SHA256SUMS", "resources/referenceFronts/*.csv", "resources/branding/*.png", "resources/branding/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
